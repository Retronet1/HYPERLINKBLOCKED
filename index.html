<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>HYPERLINK BLOCKED</title>

    <style>
      body {
        background-image: url('https://art.ngfiles.com/images/2505000/2505873_angiespice_spamton-background-thingy.png?f1651895494');
        background-repeat: repeat;
        background-position: center;
        background-size: 1000px auto;
        font-family: sans-serif;
        color: white;
        text-align: center;
        padding: 40px;
      }

      button {
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: #222;
        color: white;
      }

      button:hover {
        background-color: #444;
      }
    </style>
  </head>

  <body>
    <h1>WELCOME TO
    HYPERLINK BLOCKED
    </h1>

    <button id="audioButton">[[BACKGROUND]] MUSIC</button>

    <audio id="audio" loop>
      <source
        src="https://deltarune.com/assets/audio/midi-dialtone.mp3"
        type="audio/mpeg">
      Seu navegador não suporta áudio.
    </audio>

    <script>
      const audio = document.getElementById("audio");
      const button = document.getElementById("audioButton");

      button.addEventListener("click", () => {
        if (audio.paused) {
          audio.play();
          button.textContent = "[[PAUSA]]";
        } else {
          audio.pause();
          button.textContent = "[[BACKGROUND]] MUSIC";
        }
      });
    </script>
  </body>

</html>
